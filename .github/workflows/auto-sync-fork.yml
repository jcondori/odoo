name: Auto Sync Fork

on:
  schedule:
    - cron: "* * * * *" # Cada minuto (UTC)
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Otorga permisos de escritura al token
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs a single command using the runners shell
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream/16.0 into fork 16.0
        run: git merge upstream/16.0 --no-edit
      - name: Push changes
        run: git push origin 16.0